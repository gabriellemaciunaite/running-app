<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RunOS</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100%;
      background-color: #f8f9fa;
      color: #1a1a1a;
    }

    .top-navbar {
      height: 60px;
      background-color: #ffffff;
      border-bottom: 1px solid #e9ecef;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 24px;
      box-sizing: border-box;
    }

    .brand {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #1a1a1a;
      text-decoration: none;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .logout-btn {
      text-decoration: none;
      color: #dc3545;
      font-size: 14px;
      font-weight: 500;
      padding: 8px 16px;
      border-radius: 6px;
      transition: background-color 0.2s;
    }

    .logout-btn:hover {
      background-color: #fff5f5;
    }

    {% block extra_styles %}{% endblock %}
  </style>
</head>
<body>

  <header class="top-navbar">
    <a href="/" class="brand">RunOS</a>
    <div class="navright">
      {% if current_user.is_authenticated %}
        <a href="{{ url_for('logout') }}" class="logout-btn">Logout</a>
      {% else %}
        <a href="{{ url_for('login') }}" class="login-btn" style="text-decoration: none; margin-right: 12px; font-size: 14px; font-weight: 500;">Login</a>
        <a href="{{ url_for('register') }}" class="register-btn" style="text-decoration: none; font-size: 14px; font-weight: 500; background-color: #0066cc; color: white; padding: 6px 12px; border-radius: 6px;">Sign Up</a>
      {% endif %}
    </div>
  </header>

  {% block content %}{% endblock %}

  {% block extra_js %}{% endblock %}
</body>
</html>
