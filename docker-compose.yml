services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  web:
    build: .
    restart: unless-stopped
    command: python wsgi.py
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis

  celery_worker:
    build: .
    restart: unless-stopped
    command: celery -A make_celery.celery_app worker -B --loglevel=info
    volumes:
      - .:/app
    depends_on:
      - redis

volumes:
  redis_data: